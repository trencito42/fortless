<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%273%27 y=%275%27 width=%2726%27 height=%276.5%27 rx=%273.25%27 fill=%27%232f6bff%27/%3E%3Crect x=%273%27 y=%2713%27 width=%2726%27 height=%276.5%27 rx=%273.25%27 fill=%27%232f6bff%27 opacity=%27.62%27/%3E%3Crect x=%273%27 y=%2721%27 width=%2717%27 height=%276.5%27 rx=%273.25%27 fill=%27%232f6bff%27 opacity=%27.34%27/%3E%3C/svg%3E" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Fortless UI</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      try { var t = localStorage.getItem('fl-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
