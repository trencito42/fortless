<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Choose new password — Fortless</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/assets/auth-ui.css" />
    <script>
      (function(){
        try{
          var t = localStorage.getItem('fortless_theme') || localStorage.getItem('theme') || localStorage.getItem('ftv-theme');
          if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        }catch(e){}
      })();
    </script>
  </head>
  <body data-auth-page="reset">
    <main class="auth-shell">
      <section class="auth-main">
        <a class="brand" href="/"
          ><span class="brand-mark"
            ><img src="/assets/fortless-icon.svg" alt="" /></span
          >fortless</a
        >
        <div class="auth-card">
          <span class="eyebrow">New password</span>
          <h1>Secure the account.</h1>
          <p class="sub">A successful reset signs out every existing device.</p>
          <div id="formAlert" class="alert" role="alert" hidden></div>
          <form data-auth-form>
            <div class="field">
              <label for="password">New password</label>
              <div class="inp">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="12"
                  maxlength="128"
                  required
                  autofocus
                /><button
                  type="button"
                  data-password-toggle="password"
                  aria-label="Show password"
                >
                  <svg class="ic" viewBox="0 0 24 24">
                    <path
                      d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12Z"
                    />
                    <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  </svg>
                </button>
              </div>
              <span class="hint"
                >12+ characters with upper-case, lower-case, and a number.</span
              >
            </div>
            <button class="btn" type="submit">Change password</button>
          </form>
        </div>
        <div class="status-line">
          <span class="dot"></span>All previous sessions will be revoked
        </div>
      </section>
      <aside class="auth-art" aria-hidden="true">
        <div class="art-grid"></div>
        <div class="art-copy">
          <h2>One reset.<br />A clean slate.</h2>
          <p>
            The recovery token cannot be used again after a successful password
            change.
          </p>
        </div>
      </aside>
    </main>
    <script src="/assets/auth-ui.js"></script>
  </body>
</html>
