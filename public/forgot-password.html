<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Recover account — Fortless</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/assets/auth-ui.css" />
  </head>
  <body data-auth-page="forgot">
    <main class="auth-shell">
      <section class="auth-main">
        <a class="brand" href="/"
          ><span class="brand-mark"
            ><img src="/assets/fortless-icon.svg" alt="" /></span
          >fortless</a
        >
        <div class="auth-card">
          <span class="eyebrow">Account recovery</span>
          <h1>Reset your password.</h1>
          <p class="sub">
            The response is identical whether or not an account exists.
          </p>
          <div id="formAlert" class="alert" role="status" hidden></div>
          <form data-auth-form>
            <div class="field">
              <label for="email">Email address</label>
              <div class="inp">
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  inputmode="email"
                  required
                  autofocus
                />
              </div>
            </div>
            <button class="btn" type="submit">Request reset link</button>
          </form>
          <p class="foot">
            <a class="text-link" href="/login">Back to sign in</a>
          </p>
        </div>
        <div class="status-line">
          <span class="dot"></span>Single-use, 15-minute recovery tokens
        </div>
      </section>
      <aside class="auth-art" aria-hidden="true">
        <div class="art-grid"></div>
        <div class="art-copy">
          <h2>Recovery<br />without leaks.</h2>
          <p>
            Reset links are time-bound, single-use, and revoke previous
            sessions.
          </p>
        </div>
      </aside>
    </main>
    <script src="/assets/auth-ui.js"></script>
  </body>
</html>
