<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Verify sign in — Fortless</title><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap"><link rel="stylesheet" href="/assets/auth-ui.css"></head>
<body data-auth-page="mfa"><main class="auth-shell"><section class="auth-main"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/fortless-icon.svg" alt=""></span>fortless</a><div class="auth-card"><span class="eyebrow">Two-step verification</span><h1>Verify it’s you.</h1><p class="sub">Enter the six-digit code from your authenticator app.</p><div id="formAlert" class="alert" role="alert" hidden></div><form data-auth-form><input id="code" name="code" type="hidden"><div class="field" data-otp-wrap><label>Authenticator code</label><div class="otp" data-otp><input inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="one-time-code" required autofocus><input inputmode="numeric" maxlength="1" aria-label="Digit 2" required><input inputmode="numeric" maxlength="1" aria-label="Digit 3" required><input inputmode="numeric" maxlength="1" aria-label="Digit 4" required><input inputmode="numeric" maxlength="1" aria-label="Digit 5" required><input inputmode="numeric" maxlength="1" aria-label="Digit 6" required></div></div><div class="field" data-recovery-wrap hidden><label for="recoveryCode">Recovery code</label><div class="inp"><input id="recoveryCode" type="text" maxlength="20" autocomplete="one-time-code" disabled></div></div><button class="text-link auth-mode-toggle" type="button" data-recovery-toggle>Use a recovery code</button><button class="btn" type="submit">Continue</button></form><p class="foot"><a class="text-link" href="/login">Use another account</a></p></div><div class="status-line"><span class="dot"></span>Protected session challenge</div></section><aside class="auth-art" aria-hidden="true"><div class="art-grid"></div><div class="art-copy"><h2>One more step.<br>Your account stays yours.</h2><p>This device is only trusted after a valid second factor.</p></div></aside></main><script src="/assets/auth-ui.js"></script></body></html>
