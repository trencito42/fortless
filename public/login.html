<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sign in — Fortless</title><link rel="icon" href="/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&display=swap"><link rel="stylesheet" href="/assets/auth-ui.css"></head>
<body data-auth-page="login"><main class="auth-shell"><section class="auth-main"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/fortless-icon.svg" alt=""></span>fortless</a><div class="auth-card"><span class="eyebrow">Secure access</span><h1>Welcome back.</h1><p class="sub">Sign in to your Fortless account.</p><div id="formAlert" class="alert" role="alert" hidden></div><form data-auth-form><div class="field"><label for="email">Email address</label><div class="inp"><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required autofocus></div></div><div class="field"><label for="password">Password</label><div class="inp"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" data-password-toggle="password" aria-label="Show password"><svg class="ic" viewBox="0 0 24 24"><path d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12Z"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg></button></div></div><div class="form-row"><span></span><a class="text-link" href="/forgot-password">Forgot password?</a></div><button class="btn" type="submit">Sign in</button></form><p class="foot">New to Fortless? <a class="text-link" href="/register">Create account</a></p></div><div class="status-line"><span class="dot"></span>Protected session access</div></section><aside class="auth-art" aria-hidden="true"><div class="art-grid"></div><div class="art-copy"><h2>Hosting,<br>minus the hassle.</h2><p>One account for services, billing, support, and infrastructure controls.</p></div></aside></main><script src="/assets/auth-ui.js"></script></body></html>
