<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Păun Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: fixed sidebar + one scrolling column of flat color-blocked cards. No borders, no shadows, no gradients. Surfaces separate by background step only. Phone swaps the sidebar for a bottom tab bar. */
:root{
  --bg:#eff1f5;--s1:#ffffff;--s2:#f5f6fa;--s3:#e5e8ee;--s4:#d5dae3;
  --ink:#0b1a2b;--ink2:#4a576a;--ink3:#5a687b;--on-ink:#ffffff;
  --accent:#2a5fe8;--accent-bg:#e6edff;--on-accent:#ffffff;
  --good:#0e6b35;--good-bg:#d6f5e0;--warn:#855000;--warn-bg:#fdefc8;--bad:#b8232a;--bad-bg:#fde1e2;--info:#4a56e2;--info-bg:#e3e5ff;--violet:#7a4d90;--violet-bg:#efe1f5;--lime:#b9ff3d;--lime-ink:#0b1a12;
  --overlay:rgba(8,14,24,.42);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Tight","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --side:264px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0e15;--s1:#141a24;--s2:#1b2330;--s3:#252f3f;--s4:#344156;
    --ink:#eef2f7;--ink2:#a0adbd;--ink3:#8d9bae;--on-ink:#0a0e15;
    --accent:#7aa2ff;--accent-bg:#1a2750;--on-accent:#0a0e15;
    --good:#3ddc84;--good-bg:#123525;--warn:#f0b232;--warn-bg:#352a0e;--bad:#ff6b70;--bad-bg:#3b1618;--info:#8f9bff;--info-bg:#1f2250;--violet:#d2a9e4;--violet-bg:#2b2236;
    --overlay:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e15;--s1:#141a24;--s2:#1b2330;--s3:#252f3f;--s4:#344156;
  --ink:#eef2f7;--ink2:#a0adbd;--ink3:#8d9bae;--on-ink:#0a0e15;
  --accent:#7aa2ff;--accent-bg:#1a2750;--on-accent:#0a0e15;
  --good:#3ddc84;--good-bg:#123525;--warn:#f0b232;--warn-bg:#352a0e;--bad:#ff6b70;--bad-bg:#3b1618;--info:#8f9bff;--info-bg:#1f2250;--violet:#d2a9e4;--violet-bg:#2b2236;
  --overlay:rgba(0,0,0,.6);color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;display:block}.ic.xs{width:14px;height:14px}.ic.s{width:16px;height:16px}.ic.l{width:24px;height:24px}.ic.xl{width:32px;height:32px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;font:800 22px/1 var(--font);letter-spacing:-.05em}
.brand svg{width:40px;height:26px;flex:none}
.navlabel{padding:16px 12px 6px;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-radius:14px;color:var(--ink2);font-weight:600;font-size:14.5px;transition:background .15s,color .15s}
.nav a:hover{background:var(--s3);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--s1);color:var(--ink)}
.nav .cnt{margin-left:auto;font:700 11px/1 var(--font);padding:4px 7px;border-radius:99px;background:var(--accent);color:var(--on-accent)}
.sidefoot{margin-top:auto;padding-top:14px}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--s1)}
.me b{display:block;font-weight:700;font-size:14px}.me span{font-size:12.5px;color:var(--ink2)}
.main{min-width:0;padding:18px 28px 96px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0 14px;margin-bottom:6px;background:var(--bg)}
.top .grow{flex:1}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:0;border-radius:99px;background:var(--s1);color:var(--ink2);min-width:0;flex:1;max-width:460px;text-align:left;font-weight:500}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search kbd{margin-left:auto}
.page{display:none;flex-direction:column;gap:18px;animation:in .45s var(--ease) both}
.page.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.ph h1{font:800 32px/1.1 var(--font);letter-spacing:-.04em}
.ph p{color:var(--ink2);margin-top:6px;max-width:60ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabbar{display:none}
@media (max-width:980px){
  .app{display:block}
  .side{display:none}
  .main{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .ph h1{font-size:26px}
  .tabbar{display:flex;position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;gap:2px;border-radius:26px;background:var(--s1)}
  .tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border:0;border-radius:20px;background:none;color:var(--ink3);font:600 10.5px/1 var(--font)}
  .tabbar [aria-current="page"]{background:var(--s2);color:var(--ink)}
  .search kbd{display:none}
}

/* ---------- surfaces ---------- */
.card{background:var(--s1);border-radius:24px;padding:20px;min-width:0}
.card.s2{background:var(--s2)}
.card.flat{padding:0;overflow:hidden}
.card.tight{padding:14px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{font:700 16px/1.2 var(--font);letter-spacing:-.015em}
.ch .sp{flex:1}
.ch small{color:var(--ink2);font-weight:500}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g12{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g21{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.auto{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g4,.g12,.g21{grid-template-columns:minmax(0,1fr)}.g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.sp{flex:1}
.hr{height:2px;background:var(--s2);border:0;margin:0;border-radius:2px}
.card .hr{background:var(--s2)}
.div-v{width:2px;align-self:stretch;background:var(--s2);border-radius:2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:99px;background:var(--ink);color:var(--on-ink);font-weight:650;font-size:14px;white-space:nowrap;transition:filter .15s,transform .15s,background .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--s3);color:var(--ink)}
.btn.sec:hover{filter:brightness(.96)}
.btn.tint{background:var(--accent-bg);color:var(--accent)}
.btn.ghost{background:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--s3);color:var(--ink);filter:none}
.btn.good{background:var(--good);color:var(--on-accent)}
.btn.bad{background:var(--bad);color:#fff}
.btn.badt{background:var(--bad-bg);color:var(--bad)}
.btn.goodt{background:var(--good-bg);color:var(--good)}
.btn.warnt{background:var(--warn-bg);color:var(--warn)}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.violet{background:var(--violet-bg);color:var(--violet)}
.btn.xs{height:26px;padding:0 10px;font-size:12px;gap:5px}.btn.s{height:34px;padding:0 14px;font-size:13px;gap:6px}.btn.l{height:50px;padding:0 24px;font-size:15px}.btn.xl{height:58px;padding:0 30px;font-size:16px}
.btn.block{width:100%}
.btn.sq{width:42px;padding:0}.btn.sq.s{width:34px}.btn.sq.xs{width:26px}.btn.sq.l{width:50px}
.btn.rect{border-radius:14px}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.btn.load{pointer-events:none;color:transparent;position:relative}
.btn.load::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--on-ink);border-right-color:transparent;animation:spin .7s linear infinite}
.btn.sec.load::after{border-color:var(--ink);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.btngroup{display:inline-flex;gap:2px;align-items:stretch}.btngroup .ddwrap{display:inline-flex;position:relative}.btngroup .ddwrap .btn{border-radius:8px 99px 99px 8px}
.btngroup .btn{border-radius:8px}.btngroup .btn:first-child{border-radius:99px 8px 8px 99px}.btngroup .btn:last-child{border-radius:8px 99px 99px 8px}
.link{color:var(--accent);font-weight:650;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.fab{position:fixed;right:28px;bottom:28px;z-index:25;width:56px;height:56px}
@media (max-width:980px){.fab{bottom:calc(92px + env(safe-area-inset-bottom,0px));right:18px}}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-weight:650;font-size:13px}
.field .hint{font-size:12.5px;color:var(--ink2)}
.field .err{font-size:12.5px;color:var(--bad);display:flex;gap:5px;align-items:center}
.inp{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--s2);transition:background .15s;min-width:0}
.card.s2 .inp,.s2 .inp{background:var(--s1)}
.inp:focus-within{outline:2px solid var(--accent);outline-offset:0;background:var(--s1)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:none;outline:0;height:42px;padding:0;color:var(--ink)}
.inp textarea{height:auto;min-height:96px;padding:12px 0;resize:vertical;line-height:1.5}
.inp.ta{align-items:flex-start}
.inp input::placeholder,.inp textarea::placeholder{color:var(--ink3)}
.inp .ic{color:var(--ink3)}
.inp .pre,.inp .suf{color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
.inp.s{min-height:34px;border-radius:11px;padding:0 11px}.inp.s input{height:32px;font-size:13px}
.inp.l{min-height:54px;border-radius:18px;padding:0 18px}.inp.l input{height:52px;font-size:16px}
.inp.bad{background:var(--bad-bg)}.inp.bad:focus-within{outline-color:var(--bad)}
.inp.ok{background:var(--good-bg)}
.inp.dis{opacity:.5;pointer-events:none}
.inp.pill{border-radius:99px}
.inp select{appearance:none;-webkit-appearance:none;cursor:pointer;background:none}
.inp.sel::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg) translateY(-3px);flex:none}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--s2);border-radius:99px;padding:3px}
.stepper button{width:34px;height:34px;border:0;border-radius:50%;background:var(--s1);display:grid;place-items:center}
.stepper b{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.otp{display:flex;gap:8px}.otp input{width:46px;height:56px;border:0;border-radius:14px;background:var(--s2);text-align:center;font:700 22px/1 var(--mono);outline:0}
.otp input:focus{outline:2px solid var(--accent);background:var(--s1)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 16px;border-radius:20px;background:var(--s2);color:var(--ink2);text-align:center;cursor:pointer;transition:background .15s}
.drop:hover,.drop.over{background:var(--accent-bg);color:var(--accent)}
.tagin{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-radius:14px;background:var(--s2);min-height:44px;align-items:center}
.tagin input{flex:1;min-width:90px;border:0;background:none;outline:0;height:30px}
.tagin:focus-within{outline:2px solid var(--accent);background:var(--s1)}

/* ---------- selection ---------- */
.chk,.rad{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:550;user-select:none}
.chk input,.rad input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border-radius:7px;background:var(--s3);display:grid;place-items:center;cursor:pointer;transition:background .15s;flex:none}
.rad input{border-radius:50%}
.chk input:checked,.rad input:checked{background:var(--accent)}
.chk input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:indeterminate{background:var(--accent)}
.chk input:indeterminate::after{content:"";width:10px;height:2.5px;background:var(--on-accent);border-radius:2px}
.rad input:checked::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-accent)}
.chk input:disabled,.rad input:disabled{opacity:.4}
.chk.sq input{border-radius:50%}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:550}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:28px;margin:0;border-radius:99px;background:var(--s4);position:relative;transition:background .2s;flex:none;cursor:pointer}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw input:checked{background:var(--good)}
.sw input:checked::after{transform:translateX(18px)}
.sw.accent input:checked{background:var(--accent)}
.sw.s input{width:36px;height:22px}.sw.s input::after{width:16px;height:16px}.sw.s input:checked::after{transform:translateX(14px)}
.sw input:disabled{opacity:.4}
.seg{display:inline-flex;padding:3px;border-radius:99px;background:var(--s3);gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;font-weight:650;font-size:13px;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s}
.seg input:checked+span{background:var(--s1);color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.seg.s span{height:28px;padding:0 11px;font-size:12px}
.seg.block{display:flex}.seg.block label{flex:1}.seg.block span{justify-content:center}
.card .seg,.s1 .seg{background:var(--s2)}
.card .seg input:checked+span{background:var(--ink);color:var(--on-ink)}
.range{--p:50%;appearance:none;-webkit-appearance:none;width:100%;height:28px;background:none;margin:0;cursor:pointer}
.range::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--accent) var(--p),var(--s3) var(--p))}
.range::-moz-range-track{height:8px;border-radius:99px;background:var(--s3)}
.range::-moz-range-progress{height:8px;border-radius:99px;background:var(--accent)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--ink);margin-top:-8px}
.range::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:var(--ink)}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--s2);cursor:pointer;transition:background .15s}
.opt:has(input:checked){background:var(--accent-bg)}
.opt .ico{width:40px;height:40px;border-radius:12px;background:var(--s1);display:grid;place-items:center;flex:none}
.opt b{display:block;font-weight:700}.opt small{color:var(--ink2);font-size:12.5px}
.opt input{margin-left:auto}
.swatch{width:34px;height:34px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff}
.swatch[aria-pressed="true"]::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.rating{display:inline-flex;gap:3px;color:var(--s4)}.rating .on{color:#f0b232}.rating .ic{width:22px;height:22px;cursor:pointer;fill:currentColor}

/* ---------- display ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:99px;font:700 12px/1 var(--font);background:var(--s3);color:var(--ink2);white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.violet{background:var(--violet-bg);color:var(--violet)}.badge.accent{background:var(--accent);color:var(--on-accent)}.badge.ink{background:var(--ink);color:var(--on-ink)}.badge.lime{background:var(--lime);color:var(--lime-ink)}
.badge.l{height:30px;padding:0 13px;font-size:13px}.badge.s{height:20px;padding:0 8px;font-size:11px}
.badge.sq{border-radius:8px}
.dotc{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.pulse{position:relative}.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.6}to{transform:scale(2.6);opacity:0}}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-radius:99px;background:var(--s2);color:var(--ink);font-weight:600;font-size:13px;transition:background .15s,color .15s}
.card .chip,.s1 .chip{background:var(--s2)}
.chip:hover{background:var(--s3)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--on-ink)}
.chip .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--ink2)}
.chip.sm{height:28px;padding:0 11px;font-size:12px}
.av{--h:210;position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:hsl(var(--h) 46% 31%);color:#fff;font:700 15px/1 var(--font);letter-spacing:-.02em}
.av.xs{width:24px;height:24px;font-size:10px}.av.s{width:32px;height:32px;font-size:12px}.av.l{width:56px;height:56px;font-size:20px}.av.xl{width:80px;height:80px;font-size:28px}
.av.sqr{border-radius:28%}
html body .av.av.av:not(.more){color:#fff}
.av .st{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:9px;min-height:9px;border-radius:50%;background:var(--good);outline:3px solid var(--s1)}

function calHtml(el){
  var y=+el.dataset.y,m=+el.dataset.m,mode=el.dataset.mode,sel=el.dataset.sel||'',f=el.dataset.from||'',t=el.dataset.to||'';
  var first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();
  var now=new Date(),today=ymd(now.getFullYear(),now.getMonth(),now.getDate());
  var h='<div class="calh"><button type="button" class="btn sq s ghost" data-cn="-1" aria-label="Previous month">'+I('arrow-left-01','s')+'</button><b>'+MON[m]+' '+y+'</b><button type="button" class="btn sq s ghost" data-cn="1" aria-label="Next month">'+I('arrow-right-01','s')+'</button></div><div class="calg">';
  ['M','T','W','T','F','S','S'].forEach(function(d){h+='<span class="dw">'+d+'</span>'});
  for(var i=0;i<42;i++){
    var d,mm=m,yy=y,out=0;
    if(i<off){d=prev-off+i+1;mm=m-1;out=1}else if(i-off>=dim){d=i-off-dim+1;mm=m+1;out=1}else d=i-off+1;
    var dt=new Date(yy,mm,d),k=ymd(dt.getFullYear(),dt.getMonth(),dt.getDate());

  return h+'</div>'}
