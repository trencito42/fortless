<style>
/* Layout: viewer chrome (rail, stage, notes) around a container-query driven screen. Screens use Petal: flat color blocks, no borders or shadows. Phone mode is the same screens at 390px via container queries. */

    --good:#3ddc84;--good-bg:#123525;--warn:#f0b232;--warn-bg:#352a0e;--bad:#ff6b70;--bad-bg:#3b1618;--info:#8f9bff;--info-bg:#1f2250;--violet:#d2a9e4;--violet-bg:#2b2236;
    --overlay:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0e15;--s1:#141a24;--s2:#1b2330;--s3:#252f3f;--s4:#344156;

.tile.good{background:var(--good-bg);color:var(--good)}.tile.warn{background:var(--warn-bg);color:var(--warn)}.tile.bad{background:var(--bad-bg);color:var(--bad)}.tile.info{background:var(--info-bg);color:var(--info)}.tile.violet{background:var(--violet-bg);color:var(--violet)}.tile.neu{background:var(--s3);color:var(--ink2)}
.tile.lg{width:56px;height:56px;border-radius:18px}.tile.sm{width:34px;height:34px;border-radius:11px}.tile.sm .ic{width:16px;height:16px}

.av.v{background:var(--violet-bg);color:var(--violet)}.av.g{background:var(--good-bg);color:var(--good)}.av.w{background:var(--warn-bg);color:var(--warn)}.av.s{width:30px;height:30px;font-size:11px}
.card{background:var(--s1);border-radius:26px;padding:clamp(16px,2cqw,22px);min-width:0}
.card.flat{background:var(--s2)}
.ch{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}.ch .tx{margin-right:auto;min-width:0}.ch h3{font:800 18px/1.15 var(--font);letter-spacing:-.03em}.ch p{color:var(--ink3);font-weight:600;font-size:13px;margin-top:3px}

.li .tx{margin-right:auto;min-width:0;display:grid}.li .tx b{font-size:14.5px;letter-spacing:-.015em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .tx small{color:var(--ink3);font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col{display:flex;flex-direction:column;gap:8px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}.sp{flex:1}
.g{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:center}.kv dt{color:var(--ink3);font-weight:650;font-size:13px}.kv dd{font-weight:650;text-align:right;min-width:0;overflow-wrap:anywhere}
code,.cd{font:600 12.5px var(--mono);background:var(--s2);padding:3px 8px;border-radius:8px;color:var(--ink2)}
.card code{background:var(--s2)}

function buildRail(){
  var h='';GROUPS.forEach(function(g){h+='<h4>'+g[0]+'</h4>';g[1].forEach(function(id){h+='<button data-view="'+id+'" aria-current="'+(id===cur?'page':'false')+'">'+ic(V[id].i,'s')+V[id].t+'<small>'+String(ORDER.indexOf(id)+1).padStart(2,'0')+'</small></button>'});});
  rail.innerHTML=h;
}
function syncRail(){$$('button',rail).forEach(function(b){b.setAttribute('aria-current',b.dataset.view===cur?'page':'false')});$('#pickT').textContent=V[cur].t}
function buildNotes(){
  var v=V[cur];
  notes.innerHTML='<div class="nc"><h5>'+v.g+'</h5><h3>'+v.t+'</h3><p>'+v.note+'</p></div>'
   +'<div class="nc"><h5>Replaces</h5>'+v.src.split(' · ').map(function(s){return '<code>'+s+'</code>'}).join('')+'</div>'
   +'<div class="nc"><h5>Components on this screen</h5><ul class="cl">'+v.comps.map(function(c){return '<li><i></i><span>'+c[0]+'<small>'+c[1]+'</small></span></li>'}).join('')+'</ul></div>';
}
function render(keep,anim){
  var sc=$('.mn,.scr',dev),y=sc?sc.scrollTop:0;
  var open=$('.mdl',dev);
  var keepM=open&&keep?open:null;if(keepM)keepM.remove();
  dev.innerHTML=V[cur].fn(sub);
  if(keepM)dev.appendChild(keepM);
  var n=$('.mn,.scr',dev);if(n&&keep){n.style.scrollBehavior='auto';n.scrollTop=y;n.style.scrollBehavior=''}
  if(cur==='deploy'){wz=0;wizSet(0)}
  hydrate();syncRail();if(!keep)buildNotes();
  dev.classList.toggle('xr',$('#bXr').getAttribute('aria-pressed')==='true');
  if(cur==='verify'&&sub==='load'){clearTimeout(tmr);tmr=setTimeout(function(){if(cur==='verify'&&sub==='load'){sub='ok';render(true)}},1700)}
}
function go(id,s){if(!V[id])return;closeM();cur=id;sub=s||null;clearTimeout(tmr);render(false);try{history.replaceState(null,'','#'+id)}catch(e){}}
function hydrate(){
  $$('[data-seg]',dev).forEach(function(s){mvInd(s)});
  $$('[data-flt]',dev).forEach(function(l){applyFlt(l.id)});
}
function mvInd(){}
/* modals + toast */
function openM(name){
  closeM(true);
  if(!MD[name])return;
  var cls=MODAL_CLS[name]||'';
  var m=document.createElement('div');m.className='mdl '+cls;m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.dataset.name=name;
  m.innerHTML='<div class="ov" data-close></div><div class="bx" data-c="Modal">'+MD[name]()+'</div>';
  if(name==='cmd'||name==='acct'||name==='otix'||name==='staff'){m.querySelector('.bx').setAttribute('data-c',name==='cmd'?'Command palette':'Drawer')}
  dev.appendChild(m);
  var f=$('input,select,textarea',m);if(f&&name==='cmd')try{f.focus()}catch(e){}
}
function closeM(quiet){var m=$('.mdl',dev);if(m)m.remove()}
function toast(spec){
  var p=spec.split('|'),tone=p[0],txt=p.slice(1).join('|');
  var o=$('.toast',dev);if(o)o.remove();
  var t=document.createElement('div');t.className='toast '+tone;t.setAttribute('role','status');
  t.innerHTML=ic(tone==='bad'?'alert-circle':tone==='warn'?'alert-circle':tone==='info'?'information-circle':'tick-02','s')+'<span>'+txt+'</span>';
  dev.appendChild(t);clearTimeout(tt);tt=setTimeout(function(){t.remove()},2800);
}
/* filters */
function applyFlt(id){
  var l=document.getElementById(id);if(!l)return;
  var sg=$('[data-tg="'+id+'"]',dev),v=sg?($('[aria-selected="true"]',sg)||{dataset:{}}).dataset.v:'ALL';
  var q=$('[data-q="'+id+'"]',dev),qv=q?q.value.trim().toLowerCase():'';
  var ps=$('[data-ps="'+id+'"]',dev),pv=ps&&ps.selectedIndex>0?ps.value:'';
  var rows=$$(':scope > [data-t], :scope > [data-s]',l),n=0;
  rows.forEach(function(r){
    var ok=(!v||v==='ALL'||r.dataset.s===v)&&(!qv||(r.dataset.t||'').indexOf(qv)>-1)&&(!pv||r.dataset.p===pv);
    r.hidden=!ok;if(ok)n++;
  });
  var e=document.getElementById(id+'-e');if(e)e.hidden=n>0;
  var c=$('#svc-n',dev);if(c&&id==='svl')c.textContent=n+' of '+rows.length+' services';
}
/* password rules */
function pwCheck(inp){
  var v=inp.value,f=inp.closest('form')||dev;
  var r={len:v.length>=12,up:/[A-Z]/.test(v),lo:/[a-z]/.test(v),nu:/[0-9]/.test(v)},n=0;
  $$('[data-r]',f).forEach(function(li){var ok=r[li.dataset.r];li.classList.toggle('ok',ok);if(ok)n++});
  var cols=['','var(--bad)','var(--warn)','var(--info)','var(--good)'];
  $$('[data-str] i',f).forEach(function(b,i){b.style.background=i<n?cols[n]:''});
  return n===4;
}
function shakeAlert(msg){
  var fa=$('#fa',dev);if(!fa)return;
  fa.innerHTML='<div class="alert bad" role="alert" style="animation:shake .4s" data-c="Alert banner">'+ic('alert-circle')+'<div><b>'+msg[0]+'</b><span>'+msg[1]+'</span></div></div>';
}
function rowFor(r){return recrow(r)}
/* wizard */
var wz=0;
function wizSet(n){
  wz=Math.max(0,Math.min(2,n));
  $$('[data-wp]',dev).forEach(function(p){p.classList.toggle('on',+p.dataset.wp===wz)});
  $$('#dz-steps .step',dev).forEach(function(s,i){s.classList.toggle('cur',i===wz);s.classList.toggle('done',i<wz);var ii=s.querySelector('i');ii.innerHTML=i<wz?ic('tick-02','xs'):(i+1)});
  var b=$('#dz-back',dev),nx=$('#dz-next',dev);if(b)b.disabled=wz===0;if(nx)nx.textContent=wz===2?'Review summary':'Continue';
}
/* events */
document.addEventListener('click',function(e){
  var t=e.target;
  var el=t.closest('[data-view]');if(el&&rail.contains(el)){go(el.dataset.view);return}
  if(!dev.contains(t)){return}
  if(t.closest('[data-close]')){closeM();var g0=t.closest('[data-go]');if(!g0){var tq=t.closest('[data-toast]');if(tq)toast(tq.dataset.toast);return}}
  el=t.closest('[data-toast]');if(el&&!t.closest('[data-close]')){toast(el.dataset.toast)}
  el=t.closest('[data-go]');
  if(el){var id=el.dataset.go;if(id==='register'||id==='login'||V[id]){go(id,id==='verify'?'load':null);return}}
  el=t.closest('[data-modal]');if(el){openM(el.dataset.modal);return}
  el=t.closest('[data-st]');if(el){setData(el.dataset.st);return}
  el=t.closest('[data-seg] button');if(el){segClick(el);return}
  el=t.closest('[data-tabs] button');if(el){var tb=el.parentNode;$$('button',tb).forEach(function(b){b.setAttribute('aria-selected',b===el)});var host=tb.parentNode;$$('.tp',host).forEach(function(p){p.classList.toggle('on',p.dataset.p===el.dataset.t)});return}
  el=t.closest('.sw');if(el){el.setAttribute('aria-checked',el.getAttribute('aria-checked')!=='true');if(el.dataset.sw==='note'){var bx=el.closest('.bx');var ta=$('textarea',bx);if(ta)ta.parentNode.style.background=el.getAttribute('aria-checked')==='true'?'var(--warn-bg)':''}return}
  el=t.closest('[data-chk]');if(el){el.setAttribute('aria-checked',el.getAttribute('aria-checked')!=='true');return}
  el=t.closest('[data-eye]');if(el){var i=document.getElementById(el.dataset.eye);i.type=i.type==='password'?'text':'password';el.innerHTML=ic(i.type==='password'?'view':'view-off','s');return}
  el=t.closest('[data-copy]');if(el){try{navigator.clipboard.writeText(el.dataset.copy).then(function(){},function(){})}catch(x){}toast('good|Copied to clipboard');return}
  el=t.closest('[data-del]');if(el){var tr=el.closest('tr');tr.style.transition='opacity .25s';tr.style.opacity='0';setTimeout(function(){tr.remove()},250);toast('warn|Record deleted');return}
  el=t.closest('[data-doc]');if(el){sub=+el.dataset.doc;render(false);return}
  el=t.closest('[data-plan]');if(el){$$('[data-plan]',dev).forEach(function(b){b.setAttribute('aria-pressed',b===el)});$('#sPlan',dev).textContent=el.dataset.plan;setTot(el.dataset.price);return}
  el=t.closest('[data-reg]');if(el&&!el.disabled){$$('[data-reg]',dev).forEach(function(b){b.setAttribute('aria-pressed',b===el)});$('#sReg',dev).textContent=el.dataset.reg;return}
  el=t.closest('[data-rad]');if(el){$$('[data-rad]',el.parentNode).forEach(function(b){b.setAttribute('aria-pressed',b===el)});return}
  el=t.closest('[data-wz-b]');if(el){if(+el.dataset.wzB===1&&wz===2){toast(ST.prov?'good|Quote locked':'warn|Ordering unavailable until providers pass verification');return}wizSet(wz+ +el.dataset.wzB);return}
  el=t.closest('[data-act]');if(el){act(el.dataset.act,el)}
});
var disc=0,base=14.9;
function setTot(p){base=parseFloat(p.replace('€',''));disc=0;$('#sD',dev).hidden=true;$('#sDt',dev).hidden=true;fmtTot()}
function fmtTot(){$('#sTot',dev).textContent='€'+(base-disc).toFixed(2)}
function act(a,el){
  if(a==='theme'){toggleTheme();return}
  if(a==='mfa'){
    var ins=$$('[data-otp] input',dev),c=ins.map(function(i){return i.value}).join('');
    var box=$('[data-otp]',dev);
    if($('[data-seg="mf"] [aria-selected="true"]',dev).dataset.v==='rec'){var rv=$('#rcv',dev).value.trim();if(rv.length<8){shakeAlert(['Recovery code not recognised','Enter a code in the format xxxx-xxxx.']);return}go('home');return}
    if(c.length<6||c==='000000'){box.classList.remove('bad');void box.offsetWidth;box.classList.add('bad');shakeAlert([c.length<6?'Enter all six digits':'That code did not work','Check your authenticator app and try the newest code.']);return}
    go('home');return}
  if(a==='coupon'){var v=$('#cpn',dev).value.trim().toUpperCase();if(v==='WELCOME10'){disc=+(base*0.1).toFixed(2);$('#sD',dev).textContent='−€'+disc.toFixed(2);$('#sD',dev).hidden=false;$('#sDt',dev).hidden=false;fmtTot();toast('good|Code applied · 10% off first month')}else toast('bad|Code not recognised. Try WELCOME10');return}
  if(a==='dsearch'){var q=$('[data-q="dq"]',dev).value.trim();if(!q){toast('bad|Enter a domain to search');return}var dn=q.indexOf('.')>-1?q:q+'.net';$('#dres',dev).innerHTML=li('globe-02',/taken/.test(q)?'bad':'good',dn,/taken/.test(q)?'Already registered elsewhere':'Zone can be created',/taken/.test(q)?pill('Unavailable','bad'):pill('Available','good')+'<button class="btn xs tint" data-toast="good|Zone created · set your registrar to ns1.fortless.net">Create zone</button>');return}
  if(a==='addrec'){var n=$('#rn',dev).value.trim(),c2=$('#rc',dev).value.trim(),ty=$('#rt',dev).value.split(' ')[0],tl=$('#rl',dev).value||'3600';if(!n||!c2){toast('bad|Name and target are required');return}$('#dnsb',dev).insertAdjacentHTML('beforeend',recrow([ty,n,c2,tl]));$('#rn',dev).value='';$('#rc',dev).value='';toast('good|Record added');return}
}
function segClick(b){
  var s=b.closest('[data-seg]'),id=s.dataset.seg;
  $$('button',s).forEach(function(x){x.setAttribute('aria-selected',x===b)});
  if(id==='vf'){sub=b.dataset.v;clearTimeout(tmr);render(true);return}
  if(id==='ss'){sub=b.dataset.v;render(true);return}
  if(id==='mf'){var rec=b.dataset.v==='rec';$('#mfsub',dev).textContent=rec?'Enter one of your single-use recovery codes.':'Enter the six-digit code from your authenticator app.';$('#mfb',dev).innerHTML=rec?'<div class="fld"><label for="rcv">Recovery code</label><div class="inp"><input id="rcv" placeholder="xxxx-xxxx" autocomplete="off"></div></div>':'<div class="otp" data-otp data-c="OTP input">'+[0,1,2,3,4,5].map(function(i){return '<input inputmode="numeric" maxlength="1" aria-label="Digit '+(i+1)+'">'}).join('')+'</div>';return}
  if(s.dataset.tg)applyFlt(s.dataset.tg);
}
function setData(v){ST.data=v;$$('button',$('#sData')).forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v)});render(true)}
/* inputs */
document.addEventListener('input',function(e){
  var t=e.target;if(!dev.contains(t))return;
  if(t.hasAttribute('data-pw'))pwCheck(t);
  if(t.dataset.q&&document.getElementById(t.dataset.q)&&document.getElementById(t.dataset.q).hasAttribute('data-flt'))applyFlt(t.dataset.q);
  var o=t.closest('[data-otp]');
  if(o){t.value=t.value.replace(/\D/g,'').slice(-1);if(t.value){var n=t.nextElementSibling;if(n)n.focus()}o.classList.remove('bad')}
  if(t.dataset.ps===undefined&&false){}
});
document.addEventListener('change',function(e){var t=e.target;if(t.dataset&&t.dataset.ps)applyFlt(t.dataset.ps)});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Escape'){closeM()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openM('cmd')}
  if(t.closest&&t.closest('[data-otp]')&&e.key==='Backspace'&&!t.value&&t.previousElementSibling){t.previousElementSibling.focus()}
  if(t.hasAttribute&&t.hasAttribute('data-chk')&&(e.key===' '||e.key==='Enter')){e.preventDefault();t.click()}
  if(e.key==='Tab'){var m=$('.mdl .bx',dev);if(m){var f=$$('button,input,select,textarea,a[href]',m).filter(function(x){return !x.disabled&&x.offsetParent});if(f.length){var a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}}}
});
document.addEventListener('paste',function(e){
  var o=e.target.closest&&e.target.closest('[data-otp]');if(!o)return;
  var d=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(!d)return;e.preventDefault();
  $$('input',o).forEach(function(i,k){i.value=d[k]||''});var l=$$('input',o)[Math.min(d.length,5)];l.focus();
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form;
  if(k==='login'){var pw=$('#pw',f).value;if(!pw){shakeAlert(['Check your email and password','The credentials did not match. Try again or reset your password.']);return}go('mfa');return}
  if(k==='register'){var ok=$$('[data-r]',f).every(function(l){return l.classList.contains('ok')});var chk=$('[data-chk]',f).getAttribute('aria-checked')==='true';if(!$('#nm',f).value.trim()||!$('#em2',f).value.trim()){toast('bad|Enter your name and email');return}if(!ok||!chk){toast('bad|'+(!ok?'Meet all four password rules':'Accept the Terms and Privacy policy'));return}go('verify','load');return}
  if(k==='forgot'){var em=$('#em3',f).value.trim();if(!em){toast('bad|Enter your email address');return}f.outerHTML='<div class="alert good" role="status" data-c="Success banner">'+ic('tick-02')+'<div><b>Check your inbox</b><span>If an account exists for that address, a reset link is on its way. It works once and expires in 60 minutes.</span></div></div>';return}
  if(k==='reset'){var ok2=$$('[data-r]',f).every(function(l){return l.classList.contains('ok')});if(!ok2){toast('bad|Meet all four password rules');return}var card=f.closest('.au-card');card.innerHTML='<div class="bigic" style="background:var(--good-bg);color:var(--good)">'+ic('tick-02')+'</div><div style="display:grid;gap:8px"><h1>Password changed.</h1><p class="sub">Every other device was signed out. Sign in with your new password.</p></div><button class="btn pri blk" style="height:52px" data-go="login">Continue to sign in</button>';return}
});
/* viewer controls */
function toggleTheme(){var r=document.documentElement,dk=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dk?'light':'dark';store('ftv-theme',r.dataset.theme)}
$('#bTh').onclick=toggleTheme;
$('#bProv').onclick=function(){ST.prov=!ST.prov;this.setAttribute('aria-pressed',ST.prov);this.textContent='Providers: '+(ST.prov?'on':'off');render(true);wz=0;if(cur==='deploy')wizSet(0)};
$('#bXr').onclick=function(){var on=this.getAttribute('aria-pressed')!=='true';this.setAttribute('aria-pressed',on);dev.classList.toggle('xr',on)};
$$('#sDev button').forEach(function(b){b.onclick=function(){$$('#sDev button').forEach(function(x){x.setAttribute('aria-selected',x===b)});ST.dev=b.dataset.v;bez.classList.toggle('phone',b.dataset.v==='phone')}});
$$('#sData button').forEach(function(b){b.onclick=function(){setData(b.dataset.v)}});
function step(d){var i=(ORDER.indexOf(cur)+d+ORDER.length)%ORDER.length;go(ORDER[i])}
$('#bPrev').onclick=function(){step(-1)};$('#bNext').onclick=function(){step(1)};
$('#bPick').onclick=function(){
  var s=$('#sheet');
  s.innerHTML='<div class="mdl" style="position:fixed;z-index:200"><div class="ov" data-sh></div><div class="bx"><h3>All views</h3>'+GROUPS.map(function(g){return '<div class="dh">'+g[0]+'</div><div class="col" style="gap:4px">'+g[1].map(function(id){return '<button class="li" data-shv="'+id+'" style="padding:10px 12px">'+tile(V[id].i,id===cur?'':'neu','sm')+'<span class="tx"><b>'+V[id].t+'</b></span></button>'}).join('')+'</div>'}).join('')+'</div></div>';
};
$('#sheet').addEventListener('click',function(e){var b=e.target.closest('[data-shv]');if(b){go(b.dataset.shv);this.innerHTML='';return}if(e.target.closest('[data-sh]'))this.innerHTML=''});
/* init */
try{var th=store('ftv-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
buildRail();
var h=(location.hash||'').slice(1);if(V[h])cur=h;
render(false);wizSet(0);
window.__mk={go:go,render:render,openM:openM,V:V,ORDER:ORDER};
})();
</script>
